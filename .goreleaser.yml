version: 2
# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
# env:
#   - COSIGN_YES=true

# Every name below is built from {{ .ProjectName }}, and the Terraform registry
# will only accept assets named for the repository: terraform-provider-netskopebwan.
# goreleaser would otherwise infer this from the git remote, which is one fork or
# odd checkout away from silently renaming every artifact, so it is pinned here.
project_name: terraform-provider-netskopebwan

before:
  hooks:
    - go mod tidy
    - /bin/bash -c 'if [ -n "$(git --no-pager diff --exit-code go.mod go.sum)" ]; then exit 1; fi'

builds:
  - env:
      # goreleaser does not work with CGO, it could also complicate
      # usage by users in CI/CD systems like Terraform Cloud where
      # they are unable to install libraries.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

sboms:
  - id: default
    artifacts: source

archives:
  - formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - id: "gpg"
    # cmd: "gpg"
    args:
      # if you are using this in a GitHub action or some other automated pipeline, you
      # need to pass the batch flag to indicate its not interactive.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    artifacts: checksum
  # - id: cosign
  #   signature: "${artifact}.sbom.json.bundle"
  #   cmd: cosign
  #   args:
  #     - sign-blob
  #     - --new-bundle-format
  #     - --bundle
  #     - "${signature}"
  #     - "${artifact}"
  #   artifacts: checksum

release:
  # A tag whose version carries a semver prerelease — v1.2.3-alpha.1,
  # v1.2.3-beta1, v1.2.3-rc.2, the tags `make release` accepts alongside plain
  # ones — is published as a GitHub prerelease. That keeps it off the
  # repository's "Latest release" and out of what `terraform init` picks
  # without an explicit constraint, which is what an alpha should be.
  prerelease: auto
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true

changelog:
  disable: true
